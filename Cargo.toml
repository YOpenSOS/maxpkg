[workspace]
resolver = "2"
members = [
    "crates/hal",
    "crates/pkg",
    "crates/cli",
    "sdk/rust",
    "examples/pkg-rust",
    "examples/bt-memes",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
authors = ["YOpenSOS <https://github.com/YOpenSOS>"]

[workspace.dependencies]
anyhow = "1.0"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"

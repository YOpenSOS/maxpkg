name: Build & Publish Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.2.0)"
        required: true
        default: "0.2.0"

permissions:
  contents: write

jobs:
  release:
    name: Build aarch64-linux-android Release & SDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (aarch64-linux-android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Setup Zig 0.13.0
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Package & Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ver = "${{ inputs.version }}"
          if (-not $ver) {
            $ver = "${{ github.ref_name }}".TrimStart('v')
          }
          ./scripts/release.ps1 -Version $ver -Publish
